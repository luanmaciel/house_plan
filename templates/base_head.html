<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>

      --ink: #EFE8DC;
      --muted: #AA9D8B;
      --line: #423A2F;
      --wood: #C99A66;
      --sage: #9AAE8B;
      --sage-soft: #37402F;
      --terra: #D68F6C;
      --terra-soft: #46352B;
      --cota: #E07A63;
      --cota-soft: #47302A;
      --ok: #8FB98F;
      --warn: #D2A257;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #211D17;
    --surface: #2B2620;
    --surface-2: #332D25;
    --ink: #EFE8DC;
    --muted: #AA9D8B;
    --line: #423A2F;
    --wood: #C99A66;
    --sage: #9AAE8B;
    --sage-soft: #37402F;
    --terra: #D68F6C;
    --terra-soft: #46352B;
    --cota: #E07A63;
    --cota-soft: #47302A;
    --ok: #8FB98F;
    --warn: #D2A257;

  body {

    font-size: 17px;
    line-height: 1.65;
    margin: 0;

  /* ---------- type ---------- */
  h1, h2, h3 { font-family: "Archivo", "Segoe UI", system-ui, sans-serif; text-wrap: balance; }
  h1 { font-size: clamp(2.1rem, 6vw, 3rem); font-weight: 800; line-height: 1.06; letter-spacing: -.01em; margin: .3em 0 .35em; }
  h2 { font-size: 1.5rem; font-weight: 700; margin: 0 0 .6em; }

  .cota {

  .schema figcaption { font-size: .82rem; color: var(--muted); margin-top: 6px; }

  .check {
    background: var(--surface);
    border: 1px solid var(--line);
    border-left: 4px solid var(--cota);
    border-radius: 10px;
    padding: 20px 24px;
    box-shadow: var(--shadow);
  }
  .check ol { margin: .4em 0 0; padding-left: 1.3em; }
  .check li { margin-bottom: .55em; }

    padding: 18px 22px;
    margin: 20px 0;

  .callout.terra { background: var(--terra-soft); }

  .conta {

    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px;
    margin: 14px 0;
    font-size: .95rem;
    box-shadow: var(--shadow);
  }
  .conta b { font-weight: 700; }

  /* ---------- fases ---------- */
  .fases { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
  .fase {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 20px 14px 20px;
    display: grid;
    grid-template-columns: 44px 1fr;
    gap: 14px;
    box-shadow: var(--shadow);

  .fase-num {

    font-weight: 800;
    font-size: 1.5rem;

    line-height: 1.2;

  .fase p { margin-bottom: .3em; font-size: .97rem; }

  .swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 12px; margin-top: 16px; }

  footer { margin-top: 72px; font-size: .85rem; color: var(--muted); border-top: 2px solid var(--line); padding-top: 20px; }
